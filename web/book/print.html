<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pomi Phonics — 인쇄</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 인쇄 쪽에서는 단추를 숨기고 QR·쪽 번호를 보인다 */
  body.print #pages { display: flex; flex-direction: column; align-items: center; gap: 0; }
  @media screen { body.print { padding: 20px; } body.print .page { margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.15); } }
</style>
</head>
<body class="print">
<div id="pages"></div>
<script>window.PRINT = true;</script>
<script src="app.js"></script>
<script src="strokes.js"></script>
<script src="pages.js"></script>
<script>
// 주소: print.html?b=sb|wb&u=1  → 그 유닛의 모든 쪽을 A4 로. print.html?b=story → 스토리북 전체를 A5 가로로. &bk=2 → 2권(content/b2/).
//       &press=1 → 인쇄소용: 사방 3mm 도련을 더한 판형(A4 → 216×303mm, A5 가로 → 216×154mm) + 재단선. tools/pdf.py 가 크롬으로 PDF 를 뽑는다.
function pageSize(s) { document.head.insertAdjacentHTML('beforeend', `<style>@page { size: ${s}; margin: 0; }</style>`); }
(async () => {
  const q = new URLSearchParams(location.search); const b = q.get('b') || 'sb', u = +(q.get('u') ?? 1), press = q.get('press') === '1';
  if (!(await loadBook(+(q.get('bk') || 1)))) { document.body.textContent = 'book.json 을 읽지 못했어요'; return; }
  App.b = b; App.u = u;
  await Promise.all(App.book.units.map((x) => loadUnit(x.n)));
  const base = (App.book.site_base || '').replace(/^https?:\/\//, '');
  if (press) document.body.classList.add('press');
  if (b === 'story') { pageSize(press ? '216mm 154mm' : '210mm 148mm'); renderStory(base); return; }
  if (press) pageSize('216mm 303mm');
  const unit = App.units[u]; if (!unit) { document.body.textContent = '유닛 없음'; return; }
  const pages = pageList(unit, b), onlyP = +(q.get('p') || 0), name = q.get('name') || '';   // &p=N 이면 그 쪽만 (수료증 인쇄), &name= 은 수료증 이름
  document.getElementById('pages').innerHTML = pages.map((pg, i) => {
    const p = i + 1, no = pageNo(b, u, p);
    if (onlyP && p !== onlyP) return '';
    const ctx = { book: App.book, unit, b, u, p, page: pg, pages, print: true, name };
    const fn = PAGES[pg.type] || (() => '');
    const qr = `<img class="qr" src="../assets/qr/${bkKey()}${b}_u${String(u).padStart(2, '0')}_p${p}.png" onerror="this.style.display='none'" alt="QR">`;
    return `<article class="page ${b} t-${pg.type}"><div class="ph-head"><span class="unit">Unit ${u}</span><h2>${esc(unit.title)}</h2>${lettersBadge(unit)}</div>${fn(ctx)}<div class="ph-foot"><span>${qr}${base}/book/?b=${b}&u=${u}&p=${p}${bkParam()}</span><span>${b === 'sb' ? 'Student Book' : 'Workbook'} · Lesson ${pg.lesson.n}</span><span class="pno">${no}</span></div></article>`;
  }).join('');
  document.title = `${bookLabel()} — ${b === 'sb' ? 'Student Book' : 'Workbook'} Unit ${u}`;
  window.PRINT_READY = true;
  if (onlyP && q.get('auto') !== '0') setTimeout(() => print(), 800);   // 한 쪽 인쇄는 바로 인쇄 창
})();
// 스토리북: 표지 → 앞 쪽 → 유닛 쪽 → 뒤 쪽. 쪽마다 그림이 꽉 차고 아래 글 띠, QR 은 story.html 의 그 쪽
function renderStory(base) {
  const pages = storyPages(); if (!pages.length) { document.body.textContent = '스토리북 내용(book.json 의 storybook)이 없어요'; return; }
  document.getElementById('pages').innerHTML = pages.map((pg, i) => {
    if (pg.cover) return `<article class="page story cover"><div class="art">${pic(pg.id, '', pg.title)}</div><div class="cover-title"><small>${esc(App.book.series)} ${App.book.book}</small><h1>${esc(pg.title)}</h1></div></article>`;
    const url = `${base}/book/story.html?u=${pg.u}&p=${pg.p}${bkParam()}`;
    const qr = `<img class="qr" src="../assets/qr/${storyKey(pg)}.png" onerror="this.style.display='none'" alt="QR">`;
    const lines = (pg.lines || []).map((ln) => `<div class="line">${avatar(ln.who)}<span>${esc(ln.text)}</span></div>`).join('');
    const task = pg.task ? `<div class="task">✨ ${esc(pg.task)}${pg.task_ko ? `<small>${esc(pg.task_ko)}</small>` : ''}</div>` : '';
    const where = typeof pg.u === 'number' ? `Unit ${pg.u} · ${esc(pg.title)}` : '';
    return `<article class="page story"><div class="art">${pic(pg.id, '', pg.title)}</div><div class="band"><div class="txt"><div class="where">${where}</div>${lines}${task}</div><div class="foot">${qr}<span class="url">${url}</span><span class="pno">${i}</span></div></div></article>`;
  }).join('');
  document.title = `${bookLabel()} — ${App.book.storybook.title || 'Storybook'}`;
  window.PRINT_READY = true;
}
</script>
</body>
</html>
