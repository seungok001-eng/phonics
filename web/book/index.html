<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pomi Phonics — 웹 교재</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="teach.css">
</head>
<body>
<div id="top">
  <a class="brand" href="../">Pomi Phonics<small id="bookName"></small></a>
  <select id="selBk" onchange="goTo({bk:this.value,u:1,p:1})" style="display:none"></select>
  <select id="selBook" onchange="goTo({b:this.value,p:1})"><option value="sb">학생책</option><option value="wb">워크북</option></select>
  <select id="selUnit" onchange="goTo({u:+this.value,p:1})"></select>
  <span class="grow"></span>
  <span id="pageInfo" style="color:var(--soft);font-size:14px"></span>
  <button onclick="go(-1)" id="btnPrev">◀</button>
  <button onclick="go(1)" id="btnNext">▶</button>
  <button class="primary" onclick="mainPlay()" title="스페이스">🔊 Play</button>
  <span class="teacher-only" id="zoomBox"><button onclick="zoomBy(-0.15)" title="교재 작게 (단축키 -)">🔍−</button><button onclick="zoomSet(1)" title="화면 높이에 맞춤 (단축키 0)" id="zoomLabel">맞춤</button><button onclick="zoomBy(0.15)" title="교재 크게 (단축키 +)">🔍+</button><span class="split"><button onclick="setSplit('full')" data-split="full" title="교재만 (필기판 숨김)">교재만</button><button onclick="setSplit(0.7)" data-split="0.7" title="교재 크게">7:3</button><button onclick="setSplit(0.5)" data-split="0.5" title="반반">5:5</button><button onclick="setSplit(0.3)" data-split="0.3" title="필기판 크게">3:7</button><button onclick="toggleSide()" id="btnSide" title="필기판 옆/아래">◨</button></span><button onclick="toggleCover()" id="btnCover" title="교재 가리개 (단축키 C)">🙈</button><button onclick="toggleSlides()" title="수업 슬라이드(16:9) ↔ 교재 쪽 그대로">📐</button></span>
  <button onclick="toggleTeacher()" id="btnTeacher" title="선생님 모드: 글자·단추가 커지고 전체화면">👩‍🏫</button>
  <button onclick="toggleFull()" title="전체화면">⛶</button>
  <a class="btn" id="lnkPrint" href="#" target="_blank" title="인쇄용">🖨</a>
</div>
<div id="stage"><div id="pageWrap"><div id="coverStick"><div id="cover"><div id="coverHandle">▼ 끌어서 조금씩 보이기 · 두 번 누르면 걷기</div></div></div><div id="scaler"></div></div><div id="divider" title="끌어서 교재·필기판 크기 조절"></div></div>
<div id="overlay"><div class="card"><h1 style="color:var(--orange);margin:0 0 6px">Pomi Phonics</h1><p style="color:var(--soft);margin:0 0 18px">소리를 켜려면 한 번 눌러 주세요</p><button onclick="startApp()">▶ Start</button></div></div>
<div id="toast"></div>
<script src="app.js"></script>
<script src="strokes.js"></script>
<script src="pages.js"></script>
<script src="board.js"></script>
<script src="teach.js"></script>
<script>
// 주소: ?bk=2(권, 없으면 1권)&b=sb|wb&u=1&p=1&t=1(선생님 모드: 왼쪽 교재 + 오른쪽 필기판, 펜)
function params() { const q = new URLSearchParams(location.search); return { bk: +(q.get('bk') || 1), b: q.get('b') || 'sb', u: +(q.get('u') ?? 1), p: +(q.get('p') ?? 1), s: +(q.get('s') ?? 0), t: q.get('t') === '1' }; }
function goTo(ch) { const q = new URLSearchParams(location.search); if ('p' in ch && !('s' in ch)) ch.s = 0; for (const k in ch) q.set(k, ch[k]); if (+(q.get('bk') || 1) === 1) q.delete('bk'); if (App.teacher) q.set('t', '1'); history.pushState(null, '', '?' + q); route(); }
// 권이 바뀌면 그 권의 book.json·유닛을 다시 읽고 유닛 목록을 채운다
async function initBook(bk) {
  if (!(await loadBook(bk))) { $('scaler').innerHTML = `<p>content/${App.dir}book.json 을 읽지 못했어요 (tools/serve.py 로 열어 주세요)</p>`; return false; }
  const sel = $('selBk'); sel.innerHTML = App.books.map((x) => `<option value="${x.n}">${esc(x.title || (App.book.series + ' ' + x.n))}</option>`).join(''); sel.value = App.bk; sel.style.display = App.books.length > 1 ? '' : 'none';
  $('selUnit').innerHTML = App.book.units.map((x) => `<option value="${x.n}">Unit ${x.n} · ${esc(x.title)}</option>`).join('');
  await Promise.all(App.book.units.map((x) => loadUnit(x.n)));   // 쪽 번호 계산용
  document.title = `${bookLabel()} — 웹 교재`;
  return true;
}
async function route() {
  const { bk, b, u, p, s, t } = params();
  if (!App.book || App.bk !== bk) { if (!(await initBook(bk))) return; }
  App.b = b; App.u = u; App.p = p; App.s = s; App.teacher = t; document.body.classList.toggle('teacher', t);
  const unit = await loadUnit(u);
  $('selBook').value = b; $('selUnit').value = u; $('bookName').textContent = (App.bk > 1 ? App.bk + ' · ' : '') + (b === 'sb' ? 'Student Book' : 'Workbook');
  const scaler = $('scaler');
  if (!unit) { scaler.innerHTML = `<div class="menu"><div class="unit-card"><span class="t">${u}유닛은 아직 준비 중이에요</span></div></div>`; return; }
  const pages = pageList(unit, b);
  if (!pages.length) { scaler.innerHTML = `<div class="menu"><div class="unit-card"><span class="t">이 유닛에는 ${b === 'sb' ? '학생책' : '워크북'} 쪽이 없어요</span></div></div>`; return; }
  const pg = pages[Math.min(Math.max(1, p), pages.length) - 1];
  stopSeq(); if (pg.type !== 'story' && pg.type !== 'intro_story') Sound.bgmOff();
  const ctx = { book: App.book, unit, b, u, p, page: pg, pages, print: false };
  if (App.teacher && View.slides) {
    // 수업 화면: 16:9 슬라이드. 쪽마다 슬라이드가 여럿 (?s=번호)
    ensureBoard(unit); fit();
    const n = teachCount(ctx); App.s = Math.max(0, Math.min(App.s, n - 1));
    scaler.innerHTML = renderSlide(ctx, App.s);
    attachPageInk(scaler, `${b}_${u}_${p}_s${App.s}`, SLIDE_W, slideH());
    $('pageInfo').textContent = `Unit ${u} · ${pg.lesson.title_ko} · p.${pageNo(b, u, p)} · ${App.s + 1}/${n}`;
    $('btnPrev').disabled = p <= 1 && App.s <= 0; $('btnNext').disabled = p >= pages.length && App.s >= n - 1;
  } else {
    scaler.innerHTML = renderPage(ctx);
    if (App.teacher) { ensureBoard(unit); attachPageInk(scaler, `${b}_${u}_${p}`, 794, 1123); } else { const bp = $('boardPanel'); if (bp) bp.remove(); }
    $('pageInfo').textContent = `Unit ${u} · ${pg.lesson.title_ko} · ${p}/${pages.length} 쪽`;
    $('btnPrev').disabled = p <= 1; $('btnNext').disabled = p >= pages.length;
  }
  $('lnkPrint').href = `print.html?b=${b}&u=${u}${bkParam()}`;
  fit(); $('stage').scrollTop = 0;
}
function renderPage(ctx) {
  const fn = PAGES[ctx.page.type] || (() => `<p>모르는 쪽 종류: ${ctx.page.type}</p>`);
  const no = pageNo(ctx.b, ctx.u, ctx.p);
  return `<article class="page ${ctx.b} t-${ctx.page.type}"><div class="ph-head"><span class="unit">Unit ${ctx.u}</span><h2>${esc(ctx.unit.title)}</h2>${lettersBadge(ctx.unit)}</div><div class="body">${fn(ctx)}</div><div class="ph-foot"><span>${ctx.b === 'sb' ? 'Student Book' : 'Workbook'} · Lesson ${ctx.page.lesson.n} · ${esc(ctx.page.title)}</span><span class="pno">${no}</span></div></article>`;
}
function pageDims() { return App.teacher && View.slides ? [SLIDE_W, slideH()] : [794, 1123]; }
function go(d) {
  const pages = pageList(App.units[App.u], App.b);
  if (App.teacher && View.slides) {   // 슬라이드 안에서 먼저 움직이고, 끝이면 다음·이전 쪽으로
    const n = teachCount({ book: App.book, unit: App.units[App.u], b: App.b, u: App.u, p: App.p, page: pages[App.p - 1], pages, print: false });
    const ns = App.s + d;
    if (ns >= 0 && ns < n) { goTo({ s: ns }); return; }
    const np = App.p + d; if (np < 1 || np > pages.length) return;
    goTo({ p: np, s: d > 0 ? 0 : 99 }); return;   // 뒤로 갈 때는 그 쪽의 마지막 슬라이드
  }
  const np = App.p + d; if (np < 1 || np > pages.length) return; goTo({ p: np });
}
function mainPlay() { Sound.unlock(); const b = document.querySelector('.main-play'); if (b) b.click(); else { const s = document.querySelector('[data-say]'); if (s) s.click(); } }
function toggleTeacher() { App.teacher = !App.teacher; const q = new URLSearchParams(location.search); if (App.teacher) q.set('t', '1'); else q.delete('t'); history.replaceState(null, '', '?' + q); route(); }
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
// 선생님 모드 보기 설정 (교재 배율·교재 칸 너비·필기판 보이기) — 이 기기에 기억
const View = { zoom: 1, frac: 0.6, side: 'right', board: true, slides: true };
try { Object.assign(View, JSON.parse(localStorage.getItem('pp_view') || '{}')); } catch (e) {}
if (!(View.frac > 0.1 && View.frac < 0.95)) View.frac = 0.6;
function saveView() { try { localStorage.setItem('pp_view', JSON.stringify(View)); } catch (e) {} }
function fit() {
  const st = $('stage');
  if (!App.teacher) {
    const k = Math.max(.3, Math.min((st.clientWidth - 32) / 794, (st.clientHeight - 32) / 1123));
    $('scaler').style.transform = `scale(${k})`; $('scaler').style.width = ''; $('scaler').style.height = (1123 * k) + 'px';
    $('pageWrap').style.width = ''; $('pageWrap').style.height = ''; $('divider').style.display = 'none';
    return;
  }
  // 선생님 모드: 교재 칸과 필기판을 비율(View.frac)로 나눈다. 필기판은 옆(right) 또는 아래(bottom).
  // 교재는 칸 안에 꽉 맞추고(배율 1), 🔍·두 손가락으로 키우면 칸 안에서 스크롤
  const boardOn = View.board, side = View.side || 'right', H = 34;   // H = 손잡이 두께
  st.classList.toggle('bottom', side === 'bottom');
  const pw = $('pageWrap');
  let pwW, pwH;
  if (!boardOn) { pwW = st.clientWidth - 20; pwH = st.clientHeight - 20; }
  else if (side === 'right') { pwW = Math.max(240, Math.round((st.clientWidth - 20 - H) * View.frac)); pwH = st.clientHeight - 20; }
  else { pwW = st.clientWidth - 20; pwH = Math.max(160, Math.round((st.clientHeight - 20 - H) * View.frac)); }
  pw.style.width = pwW + 'px'; pw.style.height = pwH + 'px';
  const [PW, PH] = pageDims();
  const k = Math.max(.2, Math.min(pwH / PH, pwW / PW) * View.zoom);
  const sc = $('scaler'); sc.style.transform = `scale(${k})`; sc.style.width = (PW * k) + 'px'; sc.style.height = (PH * k) + 'px';
  $('divider').style.display = boardOn ? '' : 'none';
  const bp = $('boardPanel'); if (bp) bp.style.display = boardOn ? '' : 'none';
  $('zoomLabel').textContent = Math.round(View.zoom * 100) + '%';
  document.querySelectorAll('[data-split]').forEach((b) => b.classList.toggle('primary', b.dataset.split === (boardOn ? String(View.frac) : 'full')));
  $('btnSide').textContent = side === 'bottom' ? '⬓' : '◨'; $('btnSide').title = side === 'bottom' ? '필기판: 아래 (누르면 옆으로)' : '필기판: 옆 (누르면 아래로)';
  if (boardOn) boardResize();
  coverApply();
}
// 비율 단추: 교재만 / 7:3 / 5:5 / 3:7 (한 번 누르면 바뀐다, 태블릿용)
function setSplit(v) { if (v === 'full') View.board = false; else { View.board = true; View.frac = +v; } saveView(); fit(); if (App.teacher && View.slides) routeIfSlideHeightChanged(); }
function toggleSide() { View.side = (View.side || 'right') === 'right' ? 'bottom' : 'right'; saveView(); fit(); if (App.teacher && View.slides) routeIfSlideHeightChanged(); }
function routeIfSlideHeightChanged() { const sl = document.querySelector('.slide'); if (sl && Math.abs(parseInt(sl.style.height) - slideH()) > 60) route(); }
// 교재 가리개: 켜면 교재 칸 전체를 덮고, 아래 손잡이를 끌어 위에서부터 조금씩 보인다
function toggleCover() { View.cover = !View.cover; if (View.cover) View.coverH = 1; coverApply(); }
function coverApply() {
  const on = App.teacher && !!View.cover;
  document.body.classList.toggle('cover-on', on); $('btnCover').classList.toggle('primary', on);
  if (on) $('cover').style.height = Math.round(Math.max(.08, Math.min(1, View.coverH || 1)) * $('pageWrap').clientHeight) + 'px';
}
(() => {
  const h = document.getElementById('coverHandle'); let drag = false;
  h.addEventListener('pointerdown', (e) => { drag = true; h.setPointerCapture(e.pointerId); e.preventDefault(); });
  h.addEventListener('pointermove', (e) => { if (!drag) return; const r = $('pageWrap').getBoundingClientRect(); View.coverH = (e.clientY - r.top) / r.height; coverApply(); });
  h.addEventListener('pointerup', () => { drag = false; });
  h.addEventListener('dblclick', () => { View.cover = false; coverApply(); });
})();
function zoomBy(d) { zoomSet(View.zoom + d); }
function zoomSet(z) { View.zoom = Math.max(.5, Math.min(3, Math.round(z * 100) / 100)); saveView(); fit(); }
function toggleBoard() { setSplit(View.board ? 'full' : View.frac); }
function toggleSlides() { View.slides = !View.slides; App.s = 0; saveView(); route(); }
// 가운데 구분선 끌기 → 교재 칸 너비
(() => {
  // 굵은 손잡이: 끌면 비율, 두 번 치면 반반 (손가락 두 번 톡도 됨)
  const dv = document.getElementById('divider'); let drag = false, lastTap = 0;
  dv.addEventListener('pointerdown', (e) => { drag = true; dv.setPointerCapture(e.pointerId); e.preventDefault(); });
  dv.addEventListener('pointermove', (e) => {
    if (!drag) return; const r = $('stage').getBoundingClientRect();
    const f = (View.side || 'right') === 'right' ? (e.clientX - r.left - 10) / (r.width - 20 - 34) : (e.clientY - r.top - 10) / (r.height - 20 - 34);
    View.frac = Math.max(.2, Math.min(.85, Math.round(f * 100) / 100)); fit();
  });
  dv.addEventListener('pointerup', () => {
    if (!drag) return; drag = false; saveView();
    const now = Date.now(); if (now - lastTap < 400) { setSplit(0.5); lastTap = 0; } else lastTap = now;
    if (App.teacher && View.slides) routeIfSlideHeightChanged();
  });
})();
// Ctrl+휠 = 교재 배율, 그냥 휠 = 교재 칸 스크롤(기본 동작)
document.addEventListener('wheel', (e) => { if (!App.teacher || !e.ctrlKey) return; e.preventDefault(); zoomBy(e.deltaY < 0 ? 0.1 : -0.1); }, { passive: false });
// 선생님 모드 필기판: 없으면 만들고, 글자 도장 단추를 이 유닛 글자로 채운다
function ensureBoard(unit) {
  if (!$('boardPanel')) { $('stage').insertAdjacentHTML('beforeend', boardPanel()); boardSwitch(1); setColor(Ink.color); setSize(Ink.size); setTool('hand'); }
  const stamps = (unitFamilies(unit).length ? unitFamilies(unit).map((f) => '-' + f) : unitLetters(unit).flatMap((l) => [l.toUpperCase(), l])).concat(unit.sight_words || []);
  $('stampBtns').innerHTML = stamps.map((t) => `<button class="tb small" onclick="boardStamp('${t}')">${t}</button>`).join('');
}
function startApp() { Sound.unlock(); $('overlay').style.display = 'none'; }
if (new URLSearchParams(location.search).get('nooverlay') === '1') document.getElementById('overlay').style.display = 'none';
window.addEventListener('resize', () => { fit(); if (App.teacher && View.slides) { const sl = document.querySelector('.slide'); if (sl && Math.abs(parseInt(sl.style.height) - slideH()) > 60) route(); } });
setupPinch($('pageWrap'));
window.addEventListener('popstate', route);
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); else if (e.key === ' ') { e.preventDefault(); mainPlay(); }
  else if (App.teacher && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp')) { e.preventDefault(); const pw = $('pageWrap'); pw.scrollBy({ top: (e.key.endsWith('Down') ? 1 : -1) * (e.key.startsWith('Page') ? pw.clientHeight * 0.8 : 90), behavior: 'smooth' }); }
  else if (App.teacher && (e.key === '+' || e.key === '=')) zoomBy(0.15); else if (App.teacher && e.key === '-') zoomBy(-0.15); else if (App.teacher && e.key === '0') zoomSet(1);
  else if (App.teacher && (e.key === 'c' || e.key === 'C')) toggleCover();
});
route();
</script>
</body>
</html>
