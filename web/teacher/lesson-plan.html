<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pop! Phonics — 수업안</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root { --ink:#3B2F2F; --soft:#8C7B6B; --line:#E8DCC6; --orange:#F28C38; --cream:#FFF9EE; --blue:#4FA3E0; --red:#D9483B; --green:#4C9A2A; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Andika','Malgun Gothic',sans-serif; color:var(--ink); background:#F1E8D8; font-size:13px; line-height:1.45; }
  .sheet { width:210mm; min-height:297mm; margin:16px auto; background:#fff; padding:13mm 12mm; box-shadow:0 6px 24px rgba(0,0,0,.12); page-break-after:always; break-after:page; }
  h1 { font-family:'Fredoka'; color:var(--orange); margin:0 0 4px; font-size:23px; }
  h1 small { color:var(--soft); font-family:'Andika'; font-weight:400; font-size:13px; margin-left:8px; }
  h2 { font-family:'Fredoka'; font-size:16px; margin:12px 0 5px; color:var(--blue); }
  table { width:100%; border-collapse:collapse; }
  th, td { border:1px solid var(--line); padding:5px 7px; vertical-align:top; text-align:left; }
  th { background:var(--cream); width:20%; font-family:'Fredoka'; font-weight:500; }
  .flow th { width:auto; }
  .flow tr { break-inside:avoid; }
  td.t { width:7%; white-space:nowrap; font-weight:700; text-align:center; }
  td.a { width:19%; } td.a .pg { display:block; color:var(--soft); font-size:11px; margin-top:2px; } td.a .pg a { color:var(--blue); }
  td.k { width:24%; color:#4a4a4a; }
  .tag { display:inline-block; background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:0 6px; font-size:11px; margin-right:4px; }
  .en { color:var(--soft); font-style:italic; }
  .tot { margin-top:6px; padding:6px 10px; border-radius:8px; background:#EEF7E8; border:1px solid #CDE6BD; }
  .tot.warn { background:#FFF0E8; border-color:#F5C9AE; }
  .tot b { font-family:'Fredoka'; }
  .ln { margin:1px 0; } .ln .ko { color:var(--soft); font-size:12px; margin-left:6px; }
  .nr { color:var(--green); }
  .top { display:flex; gap:8px; align-items:center; margin:0 auto 10px; width:210mm; flex-wrap:wrap; }
  .top a, .top button { background:#fff; border:2px solid var(--line); border-radius:10px; padding:5px 10px; text-decoration:none; color:var(--ink); font-family:inherit; cursor:pointer; font-size:13px; }
  .top a.on { border-color:var(--orange); }
  @page { size:A4; margin:0; }
  @media print { body { background:#fff; } .sheet { margin:0; box-shadow:none; } .top { display:none; } a { color:inherit; text-decoration:none; } }
  body { font-variant-ligatures: none; }   /* 합자 끔 (fl·fi) */
</style>
</head>
<body>
<div class="top"><a href="../">← 홈</a><button onclick="print()">🖨 인쇄</button><span id="nav"></span></div>
<div id="out"></div>
<script>
// 수업안: 유닛 JSON 의 쪽 목록(lessons[].pages)으로 차시마다 흐름을 만든다. 쪽 종류마다 ACT 사전에 할 일·아이들 답·시간을 적어 둔다.
// 주소: ?u=1 (&bk=2). ?u=all 이면 그 권 전 유닛을 한 문서로(PDF 용). 슬라이드 수는 web/book/teach.js 의 TEACH[type].count 와 같은 규칙.
const q = new URLSearchParams(location.search), UQ = q.get('u') ?? '1';
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const BK = +(q.get('bk') || 1); let DIR = '';   // 권 번호와 그 권의 content 폴더 ('' = 1권)
async function get(rel, root) { for (const b of ['../content/', '../../content/']) { try { const r = await fetch(b + (root ? '' : DIR) + rel, { cache: 'no-store' }); if (r.ok) return r.json(); } catch (e) {} } return null; }
async function getBook() { const books = (await get('books.json', true)) || [{ n: 1, dir: '' }]; const info = books.find((x) => x.n === BK) || books[0]; DIR = info.dir || ''; const book = await get('book.json'); if (book && !book.letters && DIR) { const b1 = await get('book.json', true); if (b1) book.letters = b1.letters; } return book; }
const bkq = BK > 1 ? `&bk=${BK}` : '';   // 링크에 붙일 권 표시
// 3·4권 가족 이름: sh · a_e · ai 는 그대로, 2권 끝소리 가족(-at)과 끝소리(-nd)는 앞에 - (내용의 label 이 있으면 그것)
function famLab(book, f) { const d = (book.families || {})[f] || {}; return d.label || (!d.kind || d.kind === 'final' ? '-' + String(f).replace(/^-/, '') : f); }
function famKindOf(book, f) { return ((book.families || {})[f] || {}).kind || ''; }
// 쪽 번호: 앞 유닛들의 실제 쪽 수(읽은 유닛) — 없으면 기본(0유닛 4·복습 6·일반 8 / 워크북 0·2·4)
const ALL = {};
function pageNoOf(book, n, b, p) { let k = b === 'sb' ? 3 : 2; for (const x of book.units) { if (x.n === n) return k + p; const uj = ALL[x.n]; k += uj ? uj.lessons.reduce((a, l) => a + ((b === 'wb' ? l.workbook : l.pages) || []).length, 0) : b === 'sb' ? (x.n === 0 ? 4 : x.review ? 6 : 8) : (x.n === 0 ? 0 : x.review ? 2 : 4); } return k + p; }
const NAMES = { narrator: '해설', both: '함께' };
const ROLE_SKIP = ['narrator', 'both', 'pip'];   // 역할 읽기에서 빠지는 줄 (web/book/pages.js 와 같음 — 핍은 소리만 낸다)

// ---------- 유닛 자료 (C = 이 수업안이 쓰는 유닛 정보 한 묶음) ----------
function unitCtx(book, unit) {
  const rv = unit.review || {};
  const letters = unit.letters && unit.letters.length ? unit.letters : rv.letters || [];
  const fams = unit.families && unit.families.length ? unit.families : rv.families || [];
  const famWords = (f) => (unit.words && !Array.isArray(unit.words) && unit.words[f]) || ((book.families || {})[f] || {}).words || [];
  const objWords = unit.words && !Array.isArray(unit.words) ? Object.values(unit.words).flat() : [];
  const words = objWords.length ? objWords : rv.words || letters.flatMap((l) => (book.letters[l] || {}).words || []);
  const who = (id) => NAMES[id] || (book.characters[id] || {}).name || id;
  const st = unit.story || { panels: [] };
  const readers = [...new Set(st.panels.flatMap((p) => p.lines.map((ln) => ln.who)).concat(((unit.show || {}).recap || []).map((r) => r.line.who)))].filter((id) => !ROLE_SKIP.includes(id)).map(who);
  const sbList = unit.lessons.flatMap((l) => l.pages || []);
  const B2 = !!book.families;
  const sndOf = (l) => (book.letters[l] || {}).sound || l;
  return { book, unit, n: unit.unit, letters, fams, famWords, words, who, st, readers, B2, sndOf, sbList };
}
const lab = (C, f) => `<b>${esc(famLab(C.book, f))}</b>`;
const ltr = (l) => `<b>${l.toUpperCase()}${l}</b>`;
// 이어 소리(blend·final)는 두 소리를 잇는다 — "소리 하나" 라고 하지 않는다. 짝꿍 소리(digraph)·모음 짝(team)·마법 e 는 소리 하나
function pairTalk(C, f) {
  const k = famKindOf(C.book, f);
  if (f === 'qu') return 'qu 는 /k/+/w/ 두 소리를 빠르게 이어요 (쿠+워 → "크워")';   // 3권 데이터에는 digraph 로 되어 있지만 두 소리
  if (k === 'blend' || k === 'final') return `두 소리를 빠르게 이어요 (${esc(famLab(C.book, f).replace('-', ''))} = ${esc(String(f).replace('-', '').split('').join(' + '))}, 소리 하나가 아니에요)`;
  if (k === 'magic_e') return '끝의 e 는 소리가 없고, 모음이 제 이름 소리로 바뀌어요' + (f === 'u_e' ? ' (u_e 는 cube·cute 처럼 "유-", flute·tune 처럼 "우-" 두 가지 — 앞 소리에 따라)' : '');
  if (k) return '두 글자가 만나 소리 하나';
  return '모음 + 끝소리를 붙여 읽어요';
}
const tiles = (C, w) => { const ch = ((C.book.words || {})[w] || {}).chunks; return (ch || w.split('')).map((c) => c.replace('_', '…')).join(' … '); };   // 소리 덩어리 (cape → c … a…e … p)
const glance = (st) => !!(st && st.panels && st.panels.some((p) => p.narr));
const blendFams = (C, pg) => (pg.families && pg.families.length ? pg.families : pg.family ? [pg.family] : C.fams);

// ---------- 쪽 종류 사전 ----------
// slides: 슬라이드 수(teach.js 와 같은 규칙) · per/base: 시간(분) = base + per × 슬라이드 · name: 활동 · say: 선생님이 하는 일·말 · kids: 아이들 답
const ACT = {
  characters: { per: 0, base: 4, name: () => '친구들 만나기',
    say: (C) => `노란 말풍선을 누르면 친구가 인사해요(말버릇). ${Object.values(C.book.characters).map((c) => `<b>${esc(c.name)}</b>`).join(' · ')}. <span class="en">"Who is this? — Pip!"</span>`,
    kids: () => '이름·말버릇 따라 하기, "누구?" 하면 이름 외치기' },
  intro_story: { slides: (C) => C.st.panels.length + (glance(C.st) ? 1 : 0), per: 3, base: 1, name: () => '도입 이야기',
    say: (C) => `${glance(C.st) ? '① 이야기 한눈에: 장면을 짚으며 우리말 해설로 먼저(▶ Story in pictures). ' : ''}칸마다 ▶ — 0유닛 첫 ▶ 는 주제가가 먼저 나와요. 그림을 가리키며 "누가 있어요? 어디예요?" 우리말로 묻기. <span class="en">"${esc(firstLine(C, 0))}"</span>`,
    kids: () => '그림 보고 우리말로 한 마디, 대사 따라 말하기' },
  alphabet: { per: 0, base: 6, name: () => '알파벳 노래',
    say: () => '♪ ABC Song(알파벳 노래 음악) → A–Z names 로 한 글자씩. 이 쪽은 슬라이드가 따로 없어 교재 쪽이 그대로 나와요(🔍+ 로 키워요). 선생님이 글자를 짚으며 함께 부르기',
    kids: () => '노래 따라 부르기, 글자 이름 외치기' },
  alphabet_path: { per: 3, base: 0, name: () => 'Follow A to Z',
    say: () => '대문자 한 장·소문자 한 장. 아이들이 다음 글자를 외치면 선생님이 그 색종이를 눌러요(틀리면 소리). 자기 책에서는 선으로 잇기',
    kids: () => '"A! B! C!…" 다음 글자 외치기, 책에 선 잇기' },
  vowels: { per: 0, base: 5, name: (C) => C.book.vowels && /ː|ɪ$|eɪ|aɪ|oʊ/.test((C.book.vowels.a || {}).sound + (C.book.vowels.i || {}).sound) ? '긴 모음 5개' : '모음 5개',
    say: (C) => `모음 카드를 하나씩 누르면 소리가 나요(▶ Listen to all 은 차례로). ${Object.entries(C.book.vowels || {}).map(([v, d]) => `<b>${v}</b> /${esc(d.sound)}/`).join(' · ')}. 단어 속 빨간 글자가 모음 — "선생님용 소리 안내" 참고`,
    kids: () => '모음 소리 따라 말하기, 선생님이 짚는 모음 소리 외치기' },
  sounds: { per: 3, base: 0, name: (C) => `소리 ${C.letters.map(ltr).join(' · ')}`,
    say: (C) => { const l = C.letters[0]; return `글자마다 한 장: 🔊 Name → 🔊 Sound(세 번) → ♪ Chant(반주가 저절로). 아래 단어 그림을 눌러 단어도. <span class="en">"This is ${l.toUpperCase()}. ${l.toUpperCase()} says /${esc(C.sndOf(l))}/. Say it with me!"</span>`; },
    kids: (C) => { const l = C.letters[0]; return `"${l.toUpperCase()}! /${esc(C.sndOf(l))}/ /${esc(C.sndOf(l))}/!" 따라 말하기, 챈트는 박자에 맞춰`; } },
  trace: { per: 1.5, base: 0, name: () => '따라 쓰기 · 짝 찾기',
    say: (C) => `글자마다 획순 한 장 + 짝 찾기 한 장. 획순 그림을 누르면 순서대로 그려져요 → 허공에 크게 따라 쓰게 한 뒤 책에. 짝 찾기: <span class="en">"Where is small ${C.letters[0]}? Number…?"</span> 번호를 듣고 눌러 확인`,
    kids: () => '허공 쓰기 → 책에 따라 쓰기, 짝 찾기 번호 외치기' },
  words: { per: 3, base: 0, name: (C) => `단어 ${C.words.length}개`,
    say: (C) => { const l = C.letters[0], w = ((C.book.letters[l] || {}).words || [])[0] || ''; return `글자마다 한 장(단어 카드 3장, 번호). 그림을 누르면 단어 — 첫소리를 살려 <span class="en">"/${esc(C.sndOf(l))}/ — ${esc(w)}"</span>. "몇 번이 ${esc(w)}?" 하고 번호로 묻기. ♪ Word chant 로 다 같이`; },
    kids: () => '단어 따라 말하기, 번호 외치기, 자기 책 단어 짚기' },
  read_play: { slides: (C) => Math.ceil(C.words.length / 3) + 2, per: 1.5, base: 7, name: (C) => C.B2 ? '읽기 · 단어 잡기 · 메모리' : '읽기 · 소리 잡기 · 메모리',
    say: (C) => `① Read it! 1·2·3 — "Number 2!" 하면 그 단어를 읽게, 그림을 눌러 확인. ② ${esc((C.unit.game || {}).title || (C.B2 ? 'Read and catch!' : 'Catch the sound!'))} — 🔊 ${C.B2 ? '단어' : '소리'}를 듣고 그림 번호, A·B 팀 점수(끝나면 🔁 한 번 더). ③ Memory game — 아이가 번호 두 개를 외치면 선생님이 뒤집기(시간이 모자라면 건너뛰기, −5분)`,
    kids: () => '번호 단어 읽기, 그림 번호 외치기(팀), 카드 번호 두 개 외치기' },
  alphabet_review: { per: 4, base: 0, name: () => '알파벳 26 소리',
    say: () => '① Say all 26 sounds — ▶ 26 sounds 로 차례로, 그다음 선생님이 글자를 짚으며 "이 소리는?" ② Follow A to Z — 다음 글자를 외치면 선생님이 눌러요',
    kids: () => '26 소리 따라 말하기 → 짚는 글자 소리 외치기, 다음 글자 외치기' },
  listen_point: { per: 3, base: 0, name: () => '듣고 말하기 복습',
    say: (C) => `4장: ① Listen and repeat(▶ Auto: 글자 소리 → 단어) ② What's this?(그림만 → 아이들이 외치면 Space 로 공개) ③ Which one? 1·2·3(🔊 → 번호, A·B 팀) ④ Speed round(30초, ✔/✖). 1차시 단어 ${C.words.length}개 되살리기`,
    kids: () => '따라 말하기 → 단어 외치기 → 번호 외치기 → 빨리 읽기' },
  blend: { slides: (C, pg) => Math.ceil(blendFams(C, pg).flatMap(C.famWords).length / 5), per: 4, base: 1, name: (C, pg) => `합치기 ${blendFams(C, pg).map((f) => lab(C, f)).join(' · ')}`,
    say: (C, pg) => { const f = blendFams(C, pg)[0], w = C.famWords(f)[0] || ''; return `▶ 를 누르면 소리 타일이 하나씩 붙어 단어가 돼요. 타일을 짚으며 <span class="en">"${esc(tiles(C, w))} … ${esc(w)}!"</span> → 손뼉 한 번에 통째로. ${esc(famLab(C.book, f))}: ${pairTalk(C, f)}`; },
    kids: () => '소리 따라 하기 → 손뼉에 단어 외치기, 자기 책 글자 짚기' },
  digraph: { slides: (C, pg) => (pg.family ? 1 : Math.min(4, C.fams.length)), per: 3, base: 1, name: (C, pg) => `${famKindOf(C.book, pg.family || C.fams[0]) === 'team' ? '모음 짝' : /blend|final/.test(famKindOf(C.book, pg.family || C.fams[0])) ? '이어 소리' : '짝꿍 소리'} ${(pg.family ? [pg.family] : C.fams).map((f) => lab(C, f)).join(' · ')}`,
    say: (C, pg) => { const f = pg.family || C.fams[0], w = C.famWords(f)[0] || ''; return `▶ 를 누르면 두 글자 타일이 붙으며 소리가 나요 — ${pairTalk(C, f)}. 단어 카드는 번호로: "Number 2!" 하면 그 단어를 읽게(예: <b>${esc(w)}</b>). 단어를 눌러 확인`; },
    kids: (C, pg) => { const f = pg.family || C.fams[0]; return `${esc(famLab(C.book, f))} 소리 따라 하기(허공에 두 글자 쓰기), 번호 단어 읽기`; } },
  magic_e: { slides: (C) => (C.unit.pairs || []).filter((p) => p && p.from && p.to).length + 1, per: 2, base: 1, name: (C) => `마법 e ${C.fams.map((f) => lab(C, f)).join(' ')}`,
    say: (C) => { const p = (C.unit.pairs || [])[0] || { from: '', to: '' }; return `짝마다 한 장: 아이들이 <b>${esc(p.from)}</b> 를 읽어요 → <span class="en">"Add magic e! What's the new word?"</span> 새 단어를 먼저 외치게 한 뒤 요정을 눌러 확인(<b>${esc(p.to)}</b>). 끝 e 는 소리가 없고 모음이 제 이름 소리로. 마지막 장은 Read it! 1·2·3`; },
    kids: () => '앞 단어 읽기 → 새 단어 먼저 외치기, 짝 번호 읽기' },
  family_words: { per: 3, base: 2, name: () => '단어 읽기 · 그림 찾기',
    say: (C) => `① 가족별 단어 크게 + ♪ 챈트(박자에 맞춰 가족별로) ② Read and find 1~10 — 선생님이 단어를 누르면(소리) 아이들이 그림 번호를 외치고, 그 그림을 눌러 확인. 종이책은 그림 아래 단어 쓰기(남으면 숙제로). 가족: ${C.fams.map((f) => lab(C, f)).join(' · ')}`,
    kids: () => '챈트 따라 읽기, 그림 번호 외치기' },
  sentences: { slides: (C) => (C.unit.sentences || []).length, per: 2.5, base: 2, name: () => '문장 읽기',
    say: (C) => `문장마다 한 장: 아이들이 먼저 읽기(노란 사이트워드 ${(C.unit.sight_words || []).map((w) => `<b>${esc(w)}</b>`).join(', ')} 는 통째로) → 단어를 눌러 확인 → 🔊 문장. 예: <span class="en">"${esc(((C.unit.sentences || [])[0] || {}).text || '')}"</span> "그림에서 가리켜 볼까요?"`,
    kids: () => '문장 읽기(한 명씩·다 같이), 그림 가리키기' },
  story: { slides: (C, pg) => (pg.half === 2 ? C.st.panels.length - 2 : Math.min(2, C.st.panels.length) + (glance(C.st) ? 1 : 0)), per: 3.5, base: 0, name: (C, pg) => `스토리 ${pg.half === 2 ? '(뒤 칸)' : '(앞 칸)'}`,
    say: (C, pg) => { const i = pg.half === 2 ? 2 : 0, hid = [...new Set(C.st.panels.slice(i, i + 2).flatMap((p) => p.hidden || []))];
      return `${pg.half !== 2 && glance(C.st) ? '① 이야기 한눈에: 장면을 짚으며 우리말 해설로 줄거리 먼저(▶ Story in pictures). ' : ''}${pg.half !== 2 && (C.unit.sight_words || []).length ? `첫 칸의 사이트워드(${C.unit.sight_words.map(esc).join(', ')}) 통째로 읽기. ` : ''}칸마다 ▶ (해설 → 대사) → 따라 말하기 → 🎭 역할 읽기${C.readers.length ? `(${C.readers.map(esc).join(' · ')} — 친구 얼굴을 눌러 정하면 그 줄은 아이들이)` : ''} → 🔍 Find${hid.length ? ` 숨은 단어 ${hid.map(esc).join(', ')}` : ''}. 💬 우리말을 켜면 번역·질문이 옆에. <span class="en">"${esc(firstLine(C, i))}"</span>`; },
    kids: () => '말풍선 짚으며 따라 말하기, 맡은 역할 줄 읽기, 숨은 단어 외치기' },
  check: { per: 3, base: 0, name: () => '유닛 정리',
    say: (C) => C.B2 ? 'A 단어 읽고 그림 번호 · B 단어 → 그림 번호(선이 이어져요) · C 빠진 글자 외치기 → 빈 칸을 눌러 공개. 아이들은 자기 책에 쓰고, 화면으로 함께 확인' : 'A 🔊 → 보기 번호 · B 글자 → 그 소리로 시작하는 그림 번호 · C 첫소리 글자 외치기 → 눌러 확인. 아이들은 자기 책에 쓰고, 화면으로 함께 확인',
    kids: () => '번호·글자 외치기, 책에 동그라미·쓰기' },
  review_sounds: { per: 3, base: 2, name: (C) => `소리 복습 ${C.letters.length}글자`,
    say: () => '글자 6개씩 한 장: 먼저 "이 글자 소리는?" 묻고 → 🔊 이름·소리로 확인. ▶ Listen to all 은 차례로',
    kids: () => '글자 소리 먼저 외치기, 따라 말하기' },
  review_words: { slides: (C) => Math.ceil(((C.unit.review || {}).words || []).length / 8), per: 3, base: 1, name: (C) => `단어 복습 ${(C.unit.review || {}).words ? C.unit.review.words.length + '개' : ''}`,
    say: (C) => `단어 8개씩 한 장: 그림을 보고 아이들이 먼저 단어를 외치면 눌러 소리로 확인. 가족: ${C.fams.map((f) => lab(C, f)).join(' ')}`,
    kids: () => '그림 보고 단어 외치기' },
  review_board: { per: 0, base: 10, name: () => '놀이판 (주사위)',
    say: () => '두 팀(A·B). 선생님이 🎲 를 누르면 말이 움직여요. 도착한 칸을 그 팀이 먼저 외치게 하고 소리로 확인. ⭐ 한 칸 더 · ↩ 뒤로 · 🔁 다시 굴리기. ↺ 처음부터',
    kids: () => '팀별로 칸의 소리·단어 외치기' },
  review_bingo: { per: 0, base: 10, name: () => '빙고',
    say: () => '아이들은 자기 책 빙고판에 단어 16개를 써 둬요(수업 중에 쓰면 10분 가까이 걸려요 — 앞 차시 숙제로 미리 써 오게). 선생님이 🔊 Call a word 로 부르고 그 칸을 눌러 표시. 화면의 BINGO 는 선생님 판 기준이에요 — 아이들은 자기 판에서 한 줄이 되면 "빙고!"',
    kids: () => '부른 단어 동그라미, 한 줄이면 "Bingo!"' },
  review_test: { per: 4, base: 0, name: () => '유닛 평가',
    say: (C) => `아이들이 자기 책에 먼저 풀고, 슬라이드 A·B·C 로 함께 확인(${C.B2 ? '읽고 그림 번호 · 단어–그림 · 빠진 글자' : '🔊 듣고 번호 · 글자–그림 · 첫소리 글자'}). 점수가 낮은 아이는 시험지 생성기 B형으로 다시`,
    kids: () => '책에 풀기 → 번호·글자 외치며 확인' },
  alphabet_song: { per: 0, base: 8, name: (C) => `♪ ${esc(((C.unit.show || {}).song || {}).title || '노래')}`,
    say: () => '▶ Sing! — 반주 음악 위에 줄마다 소리. 아이들은 자기 책 가사를 보며 다 같이. 줄을 누르면 그 줄만(어려운 줄은 두 번)',
    kids: () => '가사 보며 다 같이 부르기' },
  bridge_path: { per: 0, base: 6, name: () => '징검다리 건너기',
    say: (C) => { const o = ((C.unit.show || {}).bridge || {}).families || Object.keys(C.book.families || {}); return `배운 순서대로 연못을 건너요: 아이들이 다음 돌(${o.slice(0, 4).map((f) => esc(famLab(C.book, f))).join(' → ')} …)을 외치면 선생님이 그 돌을 눌러요. 틀리면 소리가 나요`; },
    kids: () => '다음 소리 외치기' },
  word_hunt: { slides: (C) => ((C.unit.show || {}).hunt || { rounds: [] }).rounds.length, per: 2, base: 0, name: () => '단어 사냥',
    say: (C) => { const r = (((C.unit.show || {}).hunt || {}).rounds || [])[0] || {}; return `라운드마다 한 장: 장면에서 "${esc(r.family ? famLab(C.book, r.family) : r.letter || '')}" 소리 물건을 찾아 아이들이 단어를 외치면(예: ${(r.words || []).slice(0, 3).map(esc).join(', ')}) 선생님이 그 단추를 눌러 ✓. 다 찾으면 → 다음 라운드`; },
    kids: () => '장면에서 단어 찾아 외치기' },
  story_recap: { slides: (C) => ((C.unit.show || {}).recap || []).length + 1, per: 1.5, base: 2, name: () => '되짚기 공연',
    say: (C) => `장면마다 "이 장면 기억나요?" → 아이들이 우리말로 한 마디 → ▶ 대사 → 따라 말하기. 🎭 역할 읽기 가능${C.readers.length ? `(${C.readers.map(esc).join(' · ')})` : ''}. 마지막 피날레는 음악과 함께 다 같이`,
    kids: () => '장면 기억해 말하기, 대사 따라 외치기' },
  certificate: { per: 0, base: 5, name: () => '수료증',
    say: () => '이름을 넣고 🖨 로 한 장씩 인쇄돼요 — 수업 전에 미리 뽑아 두면 시간을 아껴요. 화면에 이름이 뜨면 다 같이 박수, 한 명씩 나와서 받기',
    kids: () => '이름 불리면 받기, 박수' },
};
ACT.word_song = ACT.alphabet_song;
function firstLine(C, i) { const p = C.st.panels[i] || C.st.panels[0]; return p ? (p.lines[0] || {}).text || '' : ''; }

// ---------- 차시 하나 ----------
function lessonHtml(C, li) {
  const { book, unit, n } = C, ls = unit.lessons[li], L2 = li > 0;
  const before = unit.lessons.slice(0, li), sb0 = before.reduce((a, l) => a + (l.pages || []).length, 0), wb0 = before.reduce((a, l) => a + (l.workbook || []).length, 0);
  const pages = ls.pages || [], wbs = ls.workbook || [];
  const sbNo = (i) => pageNoOf(book, n, 'sb', i), wbNo = (i) => pageNoOf(book, n, 'wb', i);
  const range = (a, b) => (a === b ? `p.${a}` : `pp.${a}–${b}`);
  // 활동 줄: 쪽마다 하나
  const rows = pages.map((pg, i) => {
    const A = ACT[pg.type] || { per: 0, base: 4, name: () => esc(pg.title || pg.type), say: () => '', kids: () => '' };
    const s = A.slides ? Math.max(1, A.slides(C, pg)) : ({ sounds: C.letters.length, trace: C.letters.length * 2, words: C.letters.length, listen_point: 4, check: 3, review_test: 3, alphabet_path: 2, alphabet_review: 2, family_words: 2, review_sounds: Math.ceil(C.letters.length / 6) }[pg.type] || 1);
    const min = Math.max(2, Math.round(A.base + A.per * s));
    const p = sb0 + i + 1, link = `../book/?b=sb&u=${n}&p=${p}&t=1${bkq}`;
    return { min, pg, html: `<td class="t">${min}'</td><td class="a">${A.name(C, pg)}<span class="pg">SB p.${sbNo(p)} · <a href="${link}">수업 화면 ${p}쪽</a> · 슬라이드 ${s}장</span></td><td>${A.say(C, pg)}</td><td class="k">${A.kids(C, pg)}</td>` };
  });
  // 처음(인사·주제가·복습)과 끝(정리·숙제)
  const prev = book.units.find((x) => x.n === n - 1);
  const prevTxt = L2 ? `1차시에 배운 ${C.B2 ? '단어' : '소리·단어'}를 플래시카드로 빠르게` : n === 0 ? '오늘부터 새 책! 표지와 친구들 그림으로 이야기 나누기' : prev && prev.n === 0 ? `0유닛 ${C.B2 ? '모음 카드' : '알파벳 노래 한 소절'}` : `지난 유닛 ${prev && (prev.letters || []).length ? prev.letters.map((l) => l.toUpperCase() + l).join(' ') : prev && (prev.families || []).length ? prev.families.map((f) => famLab(book, f)).join(' ') : '복습'} 카드를 빠르게`;
  const open = `<td class="t">4'</td><td class="a">인사 · 주제가 · 복습</td><td>인사와 출석. 주제가(▶ theme): <b>홈페이지 맨 위 "▶ 주제가" 단추</b>로 틀어요 — 수업 전에 홈페이지를 다른 탭에 열어 두세요${n === 0 ? '(0유닛은 이야기 첫 ▶ 에서도 주제가가 먼저 나와요)' : ''}. ${prevTxt}. <span class="en">"Hello, everyone! Let's sing!"</span></td><td class="k">노래 따라 부르기, 카드 보고 소리·단어 외치기</td>`;
  const hw = wbs.length ? `${range(wbNo(wb0 + 1), wbNo(wb0 + wbs.length))} (워크북 ${wbs.length}쪽, QR 을 찍으면 집에서 소리를 들을 수 있어요) · <a href="answers.html?u=${n}${bkq}">정답지</a>` : `없음 — ${n === 0 ? '0유닛은 워크북이 없어요. 집에서 QR 로 알파벳 노래·이야기 듣기' : '이 차시는 워크북 쪽이 없어요'}`;
  const close = `<td class="t">3'</td><td class="a">정리 · 숙제</td><td>오늘 배운 ${C.fams.length && !unit.review ? C.fams.map((f) => lab(C, f)).join(' · ') : C.letters.length && !unit.review ? C.letters.map(ltr).join(' · ') : '것'}을 다 같이 한 번 더. <b>숙제: WB ${hw}</b>${wbs.length ? ' — 차시 마지막 쪽 뒤의 📚 Homework 장으로 보여 줘요' : ''}. <span class="en">"Great job! See you next time!"</span></td><td class="k">다 같이 한 번 더, 숙제 쪽 확인</td>`;
  const total = 4 + 3 + rows.reduce((a, r) => a + r.min, 0);
  const next = unit.lessons[li + 1];
  let tip = '';
  if (total > 50) {
    const over = total - 50, mv = []; let cut = 0;
    if (pages.some((p) => p.type === 'read_play')) { mv.push('메모리 게임 건너뛰기(−5분)'); cut += 5; }
    // 옮기기 좋은 것: 뒤쪽의 짝꿍·합치기·문장 쪽 (놀이·정리·스토리는 그 차시에 둔다)
    for (let i = rows.length - 1; i > 0 && cut < over; i--) { const r = rows[i]; if (['read_play', 'check', 'review_test', 'certificate', 'family_words', 'story'].includes(r.pg.type)) continue; mv.push(`"${(ACT[r.pg.type] || { name: () => r.pg.type }).name(C, r.pg).replace(/<[^>]+>/g, '')}"(${r.min}분)는 ${next ? '2차시 처음으로' : '다음 시간 처음으로'}`); cut += r.min; }
    tip = `<div class="tot warn">⏱ 예상 <b>${total}분</b> — 50분을 넘어요. 넘치면: ${mv.join(' · ') || '활동마다 조금씩 줄이기'}</div>`;
  } else if (total < 40) {
    const add = unit.review ? '빙고·놀이판 한 판 더, 플래시카드 경주, 시험지 생성기로 그 범위 B형 몇 문항' : n === 0 ? (BK > 1 ? `지난 권 복습(수업 화면에서 ${BK - 1}권 12유닛 노래·단어 사냥 한 번), ` : '') + '알파벳 노래 한 번 더, 친구 이름 맞히기, 이야기를 🎭 역할로 한 번 더' : pages.some((p) => p.type === 'story') ? '스토리를 🎭 역할 바꿔 한 번 더, 플래시카드 빨리 읽기, 유닛 시험지(B형) 몇 문항' : '메모리 게임 한 판 더, 플래시카드 빨리 읽기';
    const prep = next && (next.pages || []).some((p) => p.type === 'review_bingo') ? '2차시 빙고판에 단어 16개 미리 써 두기(약 10분), ' : '';   // 빙고가 다음 차시에 있으면 판 채우기를 여기서
    tip = `<div class="tot warn">⏱ 예상 <b>${total}분</b> — 시간이 남아요. 시간이 남으면: ${prep}${add}</div>`;
  } else tip = `<div class="tot">⏱ 예상 <b>${total}분</b> (인사 4 + 활동 ${total - 7} + 정리 3)</div>`;
  const sbR = pages.length ? `학생책 ${range(sbNo(sb0 + 1), sbNo(sb0 + pages.length))}` : '';
  const mat = `<tr><th>준비물</th><td>웹 교재 수업 화면(전자칠판·TV), ${sbR}${wbs.length ? `, 워크북 ${range(wbNo(wb0 + 1), wbNo(wb0 + wbs.length))}` : ''}${(C.letters.length || C.fams.length) && n ? `, <a href="flashcards.html?u=${n}${bkq}">플래시카드</a>` : ''}${pages.some((p) => p.type === 'review_board' || p.type === 'review_bingo') ? ', 주사위 놀이판·빙고판(학생책 쪽 — 빙고판은 단어를 미리 써 오게)' : ''}</td></tr>`;
  const storyHere = pages.some((p) => ['story', 'intro_story', 'story_recap'].includes(p.type)) && !(L2 && false);
  return `<div class="sheet"><h1>Unit ${n} ${esc(unit.title)} <small>Lesson ${li + 1} · ${esc(ls.title_ko || '')} · 50분</small></h1>
    ${commonHtml(C)}${mat}</table>
    <h2>수업 흐름 <small style="font-family:Andika;color:var(--soft);font-size:12px">선생님 말은 영어, 설명은 우리말 · 아이들은 화면을 만지지 않고 입으로 답해요(번호·단어 외치기)</small></h2>
    <table class="flow"><tr><th>시간</th><th>활동 · 쪽</th><th>선생님이 하는 일·말</th><th>아이들</th></tr><tr>${open}</tr>${rows.map((r) => `<tr>${r.html}</tr>`).join('')}<tr>${close}</tr></table>${tip}
    ${storyHere ? scriptHtml(C, pages) : ''}</div>`;
}
// 위 표: 목표·소리·단어·사이트워드·스토리
function commonHtml(C) {
  const { book, unit } = C;
  const obj = unit.objectives_ko || (unit.unit === 0 ? [ '친구들 이름과 말버릇을 알고 따라 말한다', '도입 이야기를 듣고 이번 권의 세계를 안다', C.B2 ? '모음 5개의 소리를 듣고 따라 말한다' : '알파벳 노래로 26글자의 이름과 순서를 익힌다' ] : []);
  const rvN = (book.units.find((x) => x.n === unit.unit) || {}).review || [];   // 복습 범위 유닛 번호 (book.json)
  const phon = unit.review ? `복습 ${rvN.join('·')}유닛 — ${C.fams.length ? C.fams.map((f) => esc(famLab(book, f))).join(' ') : C.letters.map((l) => l.toUpperCase() + l).join(' ')}`
    : C.fams.length ? C.fams.map((f) => `${lab(C, f)} /${esc((book.families[f] || {}).sound || f)}/ <small>(${esc(famKindOf(book, f) === 'blend' || famKindOf(book, f) === 'final' ? '이어 소리' : famKindOf(book, f) === 'magic_e' ? '마법 e' : famKindOf(book, f) === 'team' ? '모음 짝' : famKindOf(book, f) ? '짝꿍 소리' : '단어 가족')})</small>`).join(' · ') + (unit.vowel && book.vowels && book.vowels[unit.vowel] && !famKindOf(book, C.fams[0]) ? ` · 모음 <b>${unit.vowel}</b> /${esc(book.vowels[unit.vowel].sound)}/` : '')
    : C.letters.length ? C.letters.map((l) => `${ltr(l)} /${esc(C.sndOf(l))}/`).join(' · ')
    : C.B2 ? `모음 ${Object.entries(book.vowels || {}).map(([v, d]) => `<b>${v}</b> /${esc(d.sound)}/`).join(' ')}` : '알파벳 26글자 이름 (미리 보기)';
  return `<table><tr><th>목표</th><td><ul style="margin:0;padding-left:16px">${obj.map((o) => `<li>${esc(o)}</li>`).join('')}</ul></td></tr>
    <tr><th>소리</th><td>${phon} <small style="color:var(--soft)">· 발음은 <a href="pronunciation.html${BK > 1 ? '?bk=' + BK : ''}">선생님용 소리 안내</a></small></td></tr>
    ${C.words.length ? `<tr><th>단어</th><td>${C.words.length > 30 ? `${C.words.length}개 — ${C.words.slice(0, 30).map(esc).join(', ')} …` : C.words.map(esc).join(', ')}</td></tr>` : ''}
    ${(unit.sight_words || []).length ? `<tr><th>사이트워드</th><td>${unit.sight_words.map(esc).join(', ')} <small style="color:var(--soft)">(소리로 쪼개지 않고 통째로 읽는 말)</small></td></tr>` : ''}
    ${C.st.title ? `<tr><th>스토리</th><td>${esc(C.st.title)}${C.st.synopsis_ko ? ` — <span style="color:var(--soft)">${esc(C.st.synopsis_ko)}</span>` : ''}</td></tr>` : ''}`;
}
// 스토리 대본: 해설 한 줄(narr) + 대사 (그 차시에 스토리·되짚기가 있을 때)
function scriptHtml(C, pages) {
  const ln = (l) => `<div class="ln"><b>${esc(C.who(l.who))}:</b> ${esc(l.text)}${l.ko ? `<span class="ko">${esc(l.ko)}</span>` : ''}</div>`;
  const halves = pages.filter((p) => p.type === 'story' || p.type === 'intro_story').map((p) => (p.type === 'intro_story' ? [0, C.st.panels.length] : p.half === 2 ? [2, C.st.panels.length] : [0, 2]));
  const idx = [...new Set(halves.flatMap(([a, b]) => C.st.panels.slice(a, b).map((_, k) => a + k)))];
  let rows = idx.map((i) => { const p = C.st.panels[i]; return `<tr><th>칸 ${i + 1}</th><td>${p.narr ? `<div class="ln nr"><b>해설:</b> ${esc(p.narr.text)}${p.narr.ko ? `<span class="ko">${esc(p.narr.ko)}</span>` : ''}</div>` : ''}${p.lines.map(ln).join('')}${(p.hidden || []).length ? `<div class="en">숨은 그림: ${p.hidden.map(esc).join(', ')}</div>` : ''}</td></tr>`; }).join('');
  if (pages.some((p) => p.type === 'story_recap')) rows += ((C.unit.show || {}).recap || []).map((r) => `<tr><th>Unit ${r.unit}</th><td>${ln(r.line)}</td></tr>`).join('');
  return rows ? `<h2>스토리 대본${C.readers.length ? ` <small style="font-family:Andika;color:var(--soft);font-size:12px">🎭 역할 읽기: ${C.readers.map(esc).join(' · ')} (핍·해설·함께 줄은 역할이 안 돼요)</small>` : ''}</h2><table>${rows}</table>` : '';
}

(async () => {
  const book = await getBook(); if (!book) { document.getElementById('out').textContent = 'book.json 을 읽지 못했어요'; return; }
  await Promise.all(book.units.map(async (x) => { if (x.ready !== false) ALL[x.n] = await get(`units/unit${String(x.n).padStart(2, '0')}.json`); }));
  const ns = book.units.map((x) => x.n).filter((n) => ALL[n]);
  document.getElementById('nav').innerHTML = ns.map((n) => `<a class="${String(n) === UQ ? 'on' : ''}" href="?u=${n}${bkq}">U${n}</a>`).join(' ') + ` <a class="${UQ === 'all' ? 'on' : ''}" href="?u=all${bkq}">전체(인쇄용)</a>`;
  const list = UQ === 'all' ? ns : [+UQ].filter((n) => ALL[n]);
  if (!list.length) { document.getElementById('out').textContent = '유닛 없음'; return; }
  document.getElementById('out').innerHTML = list.map((n) => { const C = unitCtx(book, ALL[n]); return C.unit.lessons.map((_, li) => lessonHtml(C, li)).join(''); }).join('');
  document.title = `${book.title} — 수업안 ${UQ === 'all' ? '전체' : 'Unit ' + UQ}`;
  window.PRINT_READY = true;
})();
</script>
</body>
</html>
