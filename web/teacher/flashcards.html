<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pop! Phonics — 플래시카드</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root { --ink:#3B2F2F; --soft:#8C7B6B; --line:#E8DCC6; --orange:#F28C38; --vowel:#E0523E; --conso:#2E5FBF; --cream:#FFF9EE; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Andika','Malgun Gothic',sans-serif; color:var(--ink); background:#F1E8D8; }
  .sheet { width:210mm; height:297mm; margin:16px auto; background:#fff; padding:10mm; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(2, minmax(0, 1fr)); gap:6mm; box-shadow:0 6px 24px rgba(0,0,0,.12); page-break-after:always; }
  .card { border:3px dashed var(--line); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; position:relative; min-height:0; overflow:hidden; }
  .card .glyph { font-family:'Andika'; font-size:150px; line-height:1; font-weight:700; }
  .card .glyph small { font-size:110px; font-weight:400; margin-left:8px; }
  .card img { width:80%; height:58%; object-fit:contain; flex:none; }
  .card .ph { width:70%; height:55%; background:var(--cream); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--soft); font-family:'Fredoka'; font-size:22px; }
  .card .wd { font-size:44px; font-weight:700; }
  .card .wd b { color:var(--orange); }
  .card .sw { font-size:70px; font-weight:700; }
  .card .tag { position:absolute; left:10px; top:8px; font-size:12px; color:var(--soft); }
  .vowel { color:var(--vowel); } .conso { color:var(--conso); }
  .top { display:flex; gap:10px; align-items:center; margin:0 auto 10px; width:210mm; }
  .top a, .top button { background:#fff; border:2px solid var(--line); border-radius:10px; padding:6px 12px; text-decoration:none; color:var(--ink); font-family:inherit; cursor:pointer; }
  @page { size:A4; margin:0; }
  @media print { body { background:#fff; } .sheet { margin:0; box-shadow:none; } .top { display:none; } }
  body { font-variant-ligatures: none; }   /* 합자 끔 (fl·fi) */
</style>
</head>
<body>
<div class="top"><a href="../">← 홈</a><button onclick="print()">🖨 인쇄</button><span id="nav"></span><span style="color:var(--soft);font-size:13px">A4 한 장에 4장 · 점선으로 자르기 · 두꺼운 종이 권장</span></div>
<div id="out"></div>
<script>
// 플래시카드: 글자(대·소문자) + 단어(그림·단어) + 사이트워드. ?u=1
const q = new URLSearchParams(location.search); const U = +(q.get('u') ?? 1);
const BK = +(new URLSearchParams(location.search).get('bk') || 1); let DIR = '';   // 권 번호와 그 권의 content 폴더 ('' = 1권)
async function get(rel, root) { for (const b of ['../content/', '../../content/']) { try { const r = await fetch(b + (root ? '' : DIR) + rel, { cache: 'no-store' }); if (r.ok) return r.json(); } catch (e) {} } return null; }
async function getBook() { const books = (await get('books.json', true)) || [{ n: 1, dir: '' }]; const info = books.find((x) => x.n === BK) || books[0]; DIR = info.dir || ''; const book = await get('book.json'); if (book && !book.letters && DIR) { const b1 = await get('book.json', true); if (b1) book.letters = b1.letters; } return book; }
const bkq = BK > 1 ? `&bk=${BK}` : '';   // 링크에 붙일 권 표시
// 3·4권 가족 이름: sh · a_e · ai 는 그대로, 2권 끝소리 가족(-at)과 끝소리(-nd)는 앞에 - (내용의 label 이 있으면 그것)
function famLab(book, f) { const d = (book.families || {})[f] || {}; return d.label || (!d.kind || d.kind === 'final' ? '-' + String(f).replace(/^-/, '') : f); }
function famKindOf(book, f) { return ((book.families || {})[f] || {}).kind || ''; }
// 단어에서 가족 부분 굵게: 소리 덩어리(words[w].chunks)가 있으면 그 덩어리(마법 e 는 모음과 끝 e), 없으면 끝소리 글자
function famBold(book, w, f) {
  const d = (book.words || {})[w] || {}, key = String(f).replace(/^-/, ''), ch = d.chunks, k = ch ? ch.indexOf(key) : -1;
  if (k >= 0) { const out = [], tail = []; ch.forEach((c, j) => { const b = (t) => j === k ? `<b>${t}</b>` : t; if (c.includes('_')) { out.push(b(c.split('_')[0])); tail.push(b(c.split('_')[1] || 'e')); } else out.push(b(c)); }); return out.concat(tail).join(''); }
  const i = w.lastIndexOf(key); return i < 0 ? w : `${w.slice(0, i)}<b>${key}</b>${w.slice(i + key.length)}`;
}

(async () => {
  const book = await getBook(), unit = book && await get(`units/unit${String(U).padStart(2, '0')}.json`);
  if (!unit) { document.getElementById('out').textContent = '유닛 없음'; return; }
  const has = (x) => (x.letters && x.letters.length) || (x.families && x.families.length);
  document.getElementById('nav').innerHTML = book.units.filter((x) => x.ready !== false && has(x)).map((x) => `<a href="?u=${x.n}${bkq}">U${x.n}</a>`).join(' ');
  const cls = (l) => book.letters[l].kind === 'vowel' ? 'vowel' : 'conso';
  const cards = [];
  // 2권: 가족 카드(-at, 모음 빨강) + 단어 카드(그림·단어, 가족 부분 굵게)
  for (const f of (unit.families || [])) {
    const v = (book.families[f] && book.families[f].vowel) || f[0], k = famKindOf(book, f);
    const glyph = k ? (k === 'magic_e' || k === 'team' ? `<span class="vowel">${famLab(book, f)}</span>` : famLab(book, f)) : `-<span class="vowel">${v}</span>${f.slice(f.indexOf(v) + 1)}`;
    cards.push(`<div class="card"><span class="tag">Unit ${U} · ${k ? 'sound pair' : 'word family'}</span><div class="glyph">${glyph}</div></div>`);
    for (const w of ((unit.words && unit.words[f]) || book.families[f].words)) cards.push(`<div class="card"><span class="tag">Unit ${U} · ${famLab(book, f)}</span><img src="../assets/art/word_${w}.png" alt="${w}" onerror="this.outerHTML='<div class=ph>${w}</div>'"><div class="wd">${famBold(book, w, f)}</div></div>`);
  }
  for (const l of (unit.letters || [])) {
    cards.push(`<div class="card"><span class="tag">Unit ${U} · letter</span><div class="glyph ${cls(l)}">${l.toUpperCase()}<small>${l}</small></div></div>`);
    for (const w of book.letters[l].words) {
      const i = book.letters[l].final ? w.lastIndexOf(l) : w.indexOf(l);
      cards.push(`<div class="card"><span class="tag">Unit ${U} · ${l.toUpperCase()}${l}</span><img src="../assets/art/word_${w}.png" alt="${w}" onerror="this.outerHTML='<div class=ph>${w}</div>'"><div class="wd">${w.slice(0, i)}<b>${w[i]}</b>${w.slice(i + 1)}</div></div>`);
    }
  }
  for (const w of unit.sight_words) cards.push(`<div class="card"><span class="tag">Unit ${U} · sight word</span><div class="sw">${w}</div></div>`);
  let html = '';
  for (let i = 0; i < cards.length; i += 4) html += `<div class="sheet">${cards.slice(i, i + 4).join('')}</div>`;
  document.getElementById('out').innerHTML = html;
})();
</script>
</body>
</html>
