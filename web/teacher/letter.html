<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pop! Phonics — 가정통신문</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root { --ink:#3B2F2F; --soft:#8C7B6B; --line:#E8DCC6; --orange:#F28C38; --cream:#FFF9EE; --green:#8FD14F; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Andika','Malgun Gothic',sans-serif; color:var(--ink); background:#F1E8D8; font-size:15px; line-height:1.6; }
  .sheet { width:210mm; min-height:297mm; margin:16px auto; background:#fff; padding:18mm 18mm; box-shadow:0 6px 24px rgba(0,0,0,.12); page-break-after:always; }
  h1 { font-family:'Fredoka'; color:var(--orange); margin:0; font-size:26px; }
  .sub { color:var(--soft); margin-bottom:14px; }
  h2 { font-family:'Fredoka'; font-size:18px; margin:16px 0 6px; border-left:5px solid var(--green); padding-left:8px; }
  .box { background:var(--cream); border:2px solid var(--line); border-radius:12px; padding:10px 14px; }
  .words > div { margin:2px 0; }
  .words span { display:inline-block; border:2px solid var(--line); border-radius:10px; padding:0 10px; margin:2px; font-size:17px; background:#fff; }
  .words b { color:var(--orange); }
  .snd { color:var(--soft); font-size:14px; }
  ul { margin:4px 0; padding-left:20px; }
  .qr { display:flex; gap:12px; align-items:center; }
  .qr img { width:80px; height:80px; }
  .memo { border:2px dashed var(--line); border-radius:12px; padding:8px 14px; min-height:70px; }
  .sign { margin-top:24px; text-align:right; color:var(--soft); }
  .top { display:flex; gap:10px; align-items:center; margin:0 auto 10px; width:210mm; flex-wrap:wrap; }
  .top a, .top button { background:#fff; border:2px solid var(--line); border-radius:10px; padding:6px 12px; text-decoration:none; color:var(--ink); font-family:inherit; cursor:pointer; }
  @page { size:A4; margin:0; }
  @media print { body { background:#fff; } .sheet { margin:0; box-shadow:none; } .top { display:none; } }
  body { font-variant-ligatures: none; }   /* 합자 끔 (fl·fi) */
</style>
</head>
<body>
<div class="top"><a href="../">← 홈</a><button onclick="print()">🖨 인쇄</button><span id="nav"></span><span style="color:var(--soft);font-size:13px">학원 이름·선생님 이름은 인쇄한 뒤 써 넣으세요</span></div>
<div id="out"></div>
<script>
// 가정통신문: 유닛이 끝날 때 집에 보내는 안내. ?u=1 (&bk=2). 0유닛(시작)·복습(5·11)·쇼(12)·일반 유닛 모두.
// 부모님용이라 발음 기호(IPA)는 쓰지 않고, 글자 + 우리말 비슷한 소리로 적는다 (정확한 소리는 QR 로 원어민 소리를).
const q = new URLSearchParams(location.search); const U = +(q.get('u') ?? 1);
const BK = +(q.get('bk') || 1); let DIR = '';   // 권 번호와 그 권의 content 폴더 ('' = 1권)
async function get(rel, root) { for (const b of ['../content/', '../../content/']) { try { const r = await fetch(b + (root ? '' : DIR) + rel, { cache: 'no-store' }); if (r.ok) return r.json(); } catch (e) {} } return null; }
let BOOKS = [];
async function getBook() { BOOKS = (await get('books.json', true)) || [{ n: 1, dir: '' }]; const info = BOOKS.find((x) => x.n === BK) || BOOKS[0]; DIR = info.dir || ''; const book = await get('book.json'); if (book && !book.letters && DIR) { const b1 = await get('book.json', true); if (b1) book.letters = b1.letters; } return book; }
const bkq = BK > 1 ? `&bk=${BK}` : '';   // 링크에 붙일 권 표시
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function famLab(book, f) { const d = (book.families || {})[f] || {}; return d.label || (!d.kind || d.kind === 'final' ? '-' + String(f).replace(/^-/, '') : f); }
function famKindOf(book, f) { return ((book.families || {})[f] || {}).kind || ''; }
// 단어에서 가족 부분 굵게: 소리 덩어리(words[w].chunks)가 있으면 그 덩어리(마법 e 는 모음과 끝 e), 없으면 끝소리 글자
function famBold(book, w, f) {
  const d = (book.words || {})[w] || {}, key = String(f).replace(/^-/, ''), ch = d.chunks, k = ch ? ch.indexOf(key) : -1;
  if (k >= 0) { const out = [], tail = []; ch.forEach((c, j) => { const b = (t) => j === k ? `<b>${t}</b>` : t; if (c.includes('_')) { out.push(b(c.split('_')[0])); tail.push(b(c.split('_')[1] || 'e')); } else out.push(b(c)); }); return out.concat(tail).join(''); }
  const i = w.lastIndexOf(key); return i < 0 ? w : `${w.slice(0, i)}<b>${key}</b>${w.slice(i + key.length)}`;
}
// 우리말 비슷한 소리 (부모님용). 자음은 '으'를 길게 붙이지 말고 짧게 — 아래 안내에 적는다
const KO = { a: '애 (입을 크게)', b: '브 (짧게 툭)', c: '크 (짧게)', d: '드 (짧게)', e: '에', f: '프 (윗니로 아랫입술을 살짝 물고 바람)', g: '그 (짧게)', h: '흐 (숨소리)', i: '이 (짧게, 이와 에 사이)', j: '쥐 (짧게)', k: '크 (짧게)', l: '을 (혀끝을 윗잇몸에)', m: '음 (입을 다물고)', n: '은 (혀끝을 윗잇몸에)', o: '아 (입을 크게)', p: '프 (짧게, 바람만)', q: '크우 (qu 로 써요)', r: '르 (혀를 말고 입술을 둥글게)', s: '스 (바람 소리)', t: '트 (짧게)', u: '어 (짧게)', v: '브 (윗니로 아랫입술, 떨리게)', w: '우 (입술을 둥글게)', x: '크스 (단어 끝, box)', y: '이 (yes 의 처음 소리)', z: '즈 (벌 소리처럼 떨리게)',
  sh: '쉬 (조용히 하라는 소리)', ch: '취', th: '쓰 (혀끝을 이 사이에 살짝 내밀고 바람)', ck: '크', ng: '응 (콧소리, 받침 ㅇ)', wh: '워', qu: '크워 (두 소리)',
  bl: '블', cl: '클', fl: '플', br: '브르', cr: '크르', dr: '드르', sn: '스느', st: '스트', sp: '스프', sw: '스우', nd: '은드', nt: '은트', mp: '음프',
  a_e: '에이', i_e: '아이', o_e: '오우', u_e: '유- / 우-', ai: '에이', ay: '에이', ee: '이-', ea: '이-', oa: '오우', ow: '오우', oo: '우-', ou: '아우', ar: '아르', or: '오르' };
const LONG = { a: '에이', e: '이-', i: '아이', o: '오우', u: '유-' };
const say = (k) => KO[String(k).replace(/^-/, '')] || '';
// 가족 한 줄 설명: 이어 소리는 두 소리를 잇고, 짝꿍·모음 짝은 소리 하나, 마법 e 는 끝 e 가 소리 없음
function famHow(book, f) {
  const k = famKindOf(book, f), key = String(f).replace(/^-/, '');
  if (key === 'qu') return 'q + u — k 와 w 두 소리를 빠르게 이어요 ("크워")';
  if (k === 'blend' || k === 'final') return `${key.split('').join(' + ')} — 두 소리를 빠르게 이어요 ("${say(key)}")`;
  if (k === 'magic_e') return `끝의 e 는 소리가 없고, ${key[0]} 가 제 이름 소리 "${say(key)}" 로 바뀌어요`;
  if (k) return `두 글자가 소리 하나 — "${say(key)}"`;
  const v = ((book.families || {})[f] || {}).vowel || key[0];
  return `모음 ${v} "${say(v).split(' ')[0]}" + 끝소리 ${key.slice(key.indexOf(v) + 1)}`;
}

(async () => {
  const book = await getBook(), unit = book && await get(`units/unit${String(U).padStart(2, '0')}.json`);
  if (!unit) { document.getElementById('out').textContent = '유닛 없음'; return; }
  document.getElementById('nav').innerHTML = book.units.filter((x) => x.ready !== false).map((x) => `<a href="?u=${x.n}${bkq}">U${x.n}</a>`).join(' ');
  document.getElementById('out').innerHTML = letterHtml(book, unit);
  window.PRINT_READY = true;
})();

function letterHtml(book, unit) {
  const n = unit.unit, info = book.units.find((x) => x.n === n) || {}, B2 = !!book.families, bi = BOOKS.find((x) => x.n === BK) || {};
  const fams = unit.families && unit.families.length ? unit.families : (unit.review || {}).families || [];
  const letters = unit.letters && unit.letters.length ? unit.letters : (unit.review || {}).letters || [];
  const famWords = (f) => (unit.words && !Array.isArray(unit.words) && unit.words[f]) || ((book.families || {})[f] || {}).words || [];
  const sbList = unit.lessons.flatMap((l) => l.pages), sp = Math.max(1, sbList.findIndex((p) => /story/.test(p.type)) + 1);   // QR: 이야기 첫 쪽
  const url = `${book.site_base}/book/?b=sb&u=${n}&p=${sp}${bkq}`, qrImg = `../assets/qr/${BK > 1 ? 'b' + BK + '_' : ''}sb_u${String(n).padStart(2, '0')}_p${sp}.png`;
  const hidden = [...new Set((unit.story.panels || []).flatMap((p) => p.hidden || []))].slice(0, 5);
  const sw = unit.sight_words || [];
  const nx = book.units.find((x) => x.n === n + 1);
  const nxTxt = nx ? `Unit ${nx.n} <b>${esc(nx.title)}</b> — ${nx.show ? '권 전체 복습 쇼' : nx.review ? '복습' : (nx.letters || []).length ? '글자 ' + nx.letters.map((l) => l.toUpperCase() + l).join(', ') : (nx.families || []).length ? nx.families.map((f) => famLab(book, f)).join(', ') : ''}` : `<b>최종 평가</b>(교재 밖 종이 시험 + 말하기)를 봅니다. ${BOOKS.find((x) => x.n === BK + 1) ? `그다음은 <b>${esc(BOOKS.find((x) => x.n === BK + 1).title)}</b>!` : ''}`;
  // 이번에 배운 것
  let what = '', learned = '', tips = [];
  if (n === 0) {
    what = `새 책 <b>${esc(book.title)}</b>(${esc(bi.ko || book.subtitle || '')}) 공부를 시작했습니다. 친구들(${Object.values(book.characters).map((c) => esc(c.ko || c.name)).join(', ')})을 만나고, 도입 이야기 "${esc(unit.story.title)}"를 들었습니다`;
    learned = B2 ? `<div>모음 5개: ${Object.keys(book.vowels || {}).map((v) => `<span><b>${v}</b> <small class="snd">"${esc(BK >= 4 ? LONG[v] : say(v))}"</small></span>`).join('')}</div>` : `<div>알파벳 26글자의 이름과 순서 (알파벳 노래)</div>`;
    tips = ['<b>노래 함께 듣기</b>: 아래 QR 로 이야기와 노래를 들어 보세요. 따라 부르기만 해도 충분합니다.', '<b>친구 이름 맞히기</b>: 책의 친구 그림을 가리키며 "누구야?" 하고 물어봐 주세요.', '0유닛은 워크북 숙제가 없습니다.'];
  } else if (info.review) {
    const what2 = fams.length ? fams.map((f) => famLab(book, f)).join(', ') : letters.map((l) => l.toUpperCase() + l).join(' ');
    what = info.show ? `이 책에서 배운 소리를 노래·단어 사냥·되짚기 공연으로 모두 복습하고, 수료증을 받았습니다` : `<b>${info.review.join('·')}유닛 복습</b>을 했습니다. 주사위 놀이판·빙고로 소리와 단어를 다시 익히고, 복습 평가를 보았습니다`;
    learned = `<div>복습한 소리: ${what2}</div>`;
    tips = [info.show ? '<b>노래 다시 듣기</b>: QR 로 이 책의 노래를 듣고 아는 소리를 함께 외쳐 보세요.' : '<b>카드 놀이</b>: 책 뒤 단어 그림을 보여 주며 "이건 무슨 소리로 시작해?" 하고 물어봐 주세요.',
      '<b>잘한 점을 칭찬해 주세요</b>: 아래 선생님 메모에 잘한 소리와 더 연습할 소리를 적었습니다.'];
  } else if (B2) {
    const ex = famWords(fams[0])[0] || '', exd = (book.words || {})[ex] || {}, parts = exd.chunks ? exd.chunks.map((c) => c.replace('_', '…')) : ex.split('');
    const K = fams.some((f) => famKindOf(book, f)), ME = fams.some((f) => famKindOf(book, f) === 'magic_e');
    what = ME ? `<b>마법 e</b>(${fams.map((f) => famLab(book, f)).join(', ')}) — 단어 끝에 e 가 붙으면 모음이 제 이름 소리로 바뀌는 것` : K ? `<b>${fams.map((f) => famLab(book, f)).join(', ')}</b> 소리` : `모음 <b>${esc(unit.vowel || '')}</b>가 들어간 단어 가족 <b>${fams.map((f) => famLab(book, f)).join(', ')}</b>`;
    what += (K && !ME ? '를' : '을') + ' 배우고, 소리를 <b>이어서 단어를 읽는 연습</b>을 했습니다';
    learned = fams.map((f) => `<div><b>${esc(famLab(book, f))}</b> <small class="snd">${esc(famHow(book, f))}</small><br>${famWords(f).map((w) => `<span>${famBold(book, w, f)} <small class="snd">${esc((book.words[w] || {}).ko || '')}</small></span>`).join('')}</div>`).join('');
    tips = [`<b>이어 읽기</b>: 글자를 하나씩 짚으며 소리를 낸 뒤 손뼉 한 번에 통째로 말하게 해 주세요. 예: ${parts.map(esc).join(' – ')} → "<b>${esc(ex)}</b>!" 글자 이름("씨, 에이…")이 아니라 <b>소리</b>로 합니다.`,
      ME ? `<b>마법 e 놀이</b>: ${(unit.pairs || []).slice(0, 3).map((p) => `${esc(p.from)} → ${esc(p.to)}`).join(', ')} 처럼 끝에 e 를 붙이면 어떻게 바뀌는지 읽어 보게 해 주세요.` : K ? `<b>소리 찾기</b>: 책이나 간판에서 ${fams.map((f) => famLab(book, f)).join(', ')} 를 찾아 소리 내 보게 해 주세요.` : `<b>첫 글자 바꾸기</b>: "${famWords(fams[0]).slice(0, 3).map(esc).join(' → ')}" 처럼 첫 글자만 바꿔 가며 읽기.`,
      `<b>문장 세 번 읽기</b>: ${(unit.sentences || []).slice(0, 1).map((s) => `"${esc(s.text)}"`).join('')} 같은 문장을 QR 로 듣고 따라 읽게 해 주세요.`];
  } else {
    const l = letters[0], w = ((book.letters[l] || {}).words || [])[0] || '';
    what = `글자 <b>${letters.map((x) => x.toUpperCase() + x).join(', ')}</b>의 이름과 소리를 배우고, 그 소리로 시작하는 단어를 익혔습니다`;
    learned = letters.map((x) => `<div><b>${x.toUpperCase()}${x}</b> <small class="snd">소리 "${esc(say(x))}"</small> — ${((book.letters[x] || {}).words || []).map((wd) => { const i = (book.letters[x] || {}).final ? wd.lastIndexOf(x) : wd.indexOf(x); return `<span>${esc(wd.slice(0, i))}<b>${esc(wd[i])}</b>${esc(wd.slice(i + 1))} <small class="snd">${esc((book.words[wd] || {}).ko || '')}</small></span>`; }).join('')}</div>`).join('');
    tips = [`<b>소리로 물어보기</b>: 글자 이름("${l.toUpperCase()}")보다 <b>소리</b>로 물어봐 주세요. "${l.toUpperCase()}는 무슨 소리?" → "${esc(say(l).split(' ')[0])}! ${esc(w)}!"`,
      '<b>짧게 툭</b>: 자음 소리는 "브~"처럼 길게 끌지 말고 짧게 냅니다. 정확한 소리는 QR 로 들어 보세요.'];
  }
  if (hidden.length && n) tips.push(`<b>숨은 그림 찾기</b>: 이야기 그림에서 ${hidden.map(esc).join(', ')} … 를 찾아 영어로 말해 보게 해 주세요.`);
  const memo = info.review ? `<h2>선생님 메모</h2><div class="memo">잘한 소리: <br>더 연습할 소리: </div>` : '';
  return `<div class="sheet">
    <h1>${esc(book.title)} 가정통신문</h1><div class="sub">Unit ${n} · ${esc(unit.title)} (${esc(unit.title_ko || '')}) · 학원: ________________ · 선생님: ________________</div>
    <p>안녕하세요. 이번 주 아이들은 <b>Unit ${n}</b>에서 ${what}. 집에서 아래 내용으로 5분만 함께해 주시면 학습 효과가 훨씬 커집니다.</p>
    <h2>이번 유닛에서 배운 것</h2>
    <div class="box words">${learned}</div>
    ${sw.length ? `<p style="margin-top:8px">사이트워드(소리로 쪼개지 않고 통째로 읽는 말): <b>${sw.map(esc).join(', ')}</b> · 이야기: <b>${esc(unit.story.title)}</b></p>` : `<p style="margin-top:8px">이야기: <b>${esc(unit.story.title)}</b></p>`}
    <h2>집에서 이렇게 해 주세요</h2>
    <ul>${tips.map((t) => `<li>${t}</li>`).join('')}</ul>
    ${memo}
    <h2>소리 듣기</h2>
    <div class="qr"><img src="${qrImg}" alt="QR" onerror="this.style.display='none'"><div>휴대폰으로 QR 을 찍거나 아래 주소로 들어가면 이번 유닛의 소리·이야기를 원어민 소리로 들을 수 있습니다. 워크북 숙제 쪽의 QR 도 같아요.<br><small>${esc(url)}</small><br>처음 한 번 "Start" 를 누르면 소리가 납니다.</div></div>
    <h2>다음 시간</h2>
    <p>${nxTxt}${nx ? '. 워크북 숙제를 잊지 말고 가져오게 해 주세요.' : ''}</p>
    <div class="sign">${new Date().getFullYear()}년 ____월 ____일 · ${esc(book.title)}</div>
  </div>`;
}
</script>
</body>
</html>
