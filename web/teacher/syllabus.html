<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pop! Phonics — 진도표</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root { --ink:#3B2F2F; --soft:#8C7B6B; --line:#E8DCC6; --orange:#F28C38; --cream:#FFF9EE; --blue:#4FA3E0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Andika','Malgun Gothic',sans-serif; color:var(--ink); background:#F1E8D8; font-size:13px; }
  .sheet { width:297mm; min-height:210mm; margin:16px auto; background:#fff; padding:12mm 14mm; box-shadow:0 6px 24px rgba(0,0,0,.12); page-break-after:always; }
  h1 { font-family:'Fredoka'; color:var(--orange); margin:0 0 8px; font-size:24px; } h1 small { color:var(--soft); font-family:'Andika'; font-weight:400; font-size:13px; margin-left:8px; }
  table { width:100%; border-collapse:collapse; }
  th, td { border:1px solid var(--line); padding:5px 7px; vertical-align:top; text-align:left; }
  th { background:var(--cream); font-family:'Fredoka'; font-weight:500; }
  td.c { text-align:center; white-space:nowrap; }
  tr.rev td { background:#FFF3E6; } tr.fin td { background:#EAF5FF; font-weight:600; }
  .top { display:flex; gap:10px; align-items:center; margin:0 auto 10px; width:297mm; }
  .top a, .top button { background:#fff; border:2px solid var(--line); border-radius:10px; padding:6px 12px; text-decoration:none; color:var(--ink); font-family:inherit; cursor:pointer; }
  @page { size:A4 landscape; margin:0; }
  @media print { body { background:#fff; } .sheet { margin:0; box-shadow:none; } .top { display:none; } }
  body { font-variant-ligatures: none; }   /* 합자 끔 (fl·fi) */
</style>
</head>
<body>
<div class="top"><a href="../">← 홈</a><button onclick="print()">🖨 인쇄</button><span style="color:var(--soft)" id="topNote"></span></div>
<div id="out"></div>
<script>
// 진도표: book.json 유닛 목록과 유닛 JSON 의 차시에서 자동으로. 주 2회(기본)와 주 3회(유닛마다 복습 차시) 두 가지, 끝에 최종 평가 한 차시
const BK = +(new URLSearchParams(location.search).get('bk') || 1); let DIR = '';   // 권 번호와 그 권의 content 폴더 ('' = 1권)
async function get(rel, root) { for (const b of ['../content/', '../../content/']) { try { const r = await fetch(b + (root ? '' : DIR) + rel, { cache: 'no-store' }); if (r.ok) return r.json(); } catch (e) {} } return null; }
async function getBook() { const books = (await get('books.json', true)) || [{ n: 1, dir: '' }]; const info = books.find((x) => x.n === BK) || books[0]; DIR = info.dir || ''; const book = await get('book.json'); if (book && !book.letters && DIR) { const b1 = await get('book.json', true); if (b1) book.letters = b1.letters; } return book; }
const bkq = BK > 1 ? `&bk=${BK}` : '';
const esc = (x) => String(x ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));   // 링크에 붙일 권 표시
// 3·4권 가족 이름: sh · a_e · ai 는 그대로, 2권 끝소리 가족(-at)과 끝소리(-nd)는 앞에 - (내용의 label 이 있으면 그것)
function famLab(book, f) { const d = (book.families || {})[f] || {}; return d.label || (!d.kind || d.kind === 'final' ? '-' + String(f).replace(/^-/, '') : f); }
function famKindOf(book, f) { return ((book.families || {})[f] || {}).kind || ''; }
// 단어에서 가족 부분 굵게: 소리 덩어리(words[w].chunks)가 있으면 그 덩어리(마법 e 는 모음과 끝 e), 없으면 끝소리 글자
function famBold(book, w, f) {
  const d = (book.words || {})[w] || {}, key = String(f).replace(/^-/, ''), ch = d.chunks, k = ch ? ch.indexOf(key) : -1;
  if (k >= 0) { const out = [], tail = []; ch.forEach((c, j) => { const b = (t) => j === k ? `<b>${t}</b>` : t; if (c.includes('_')) { out.push(b(c.split('_')[0])); tail.push(b(c.split('_')[1] || 'e')); } else out.push(b(c)); }); return out.concat(tail).join(''); }
  const i = w.lastIndexOf(key); return i < 0 ? w : `${w.slice(0, i)}<b>${key}</b>${w.slice(i + key.length)}`;
}

(async () => {
  const book = await getBook(); if (!book) return;
  const B2 = !!book.families;
  const units = {};
  await Promise.all(book.units.map(async (u) => { if (u.ready !== false) units[u.n] = await get(`units/unit${String(u.n).padStart(2, '0')}.json`); }));
  // 쪽 수: 읽은 유닛은 실제 쪽 수, 아직 없는 유닛은 기본(0유닛 4·복습 6·일반 8 / 워크북 0·2·4)
  const cnt = (x, b) => { const uj = units[x.n]; return uj ? uj.lessons.reduce((a, l) => a + ((b === 'wb' ? l.workbook : l.pages) || []).length, 0) : b === 'wb' ? (x.n === 0 ? 0 : x.review ? 2 : 4) : (x.n === 0 ? 4 : x.review ? 6 : 8); };
  const sbStart = (n) => { let p = 3; for (const x of book.units) { if (x.n === n) return p + 1; p += cnt(x, 'sb'); } return p; };
  const wbStart = (n) => { let p = 2; for (const x of book.units) { if (x.n === n) return p + 1; p += cnt(x, 'wb'); } return p; };
  const KIND = Object.values(book.families || {}).some((f) => f.kind);   // 3·4권 (짝꿍 소리·마법 e·모음 짝)
  const words = (u) => (B2 ? (u.families || []).flatMap((f) => (u.words && u.words[f]) || book.families[f].words) : u.letters.flatMap((l) => book.letters[l].words)).join(', ');
  const sw = (u) => Object.entries(book.sight_words).filter(([w, s]) => s.unit === u.n).map(([w]) => w).join(', ');
  const famWord = !B2 ? '소리·단어' : !KIND ? '단어 가족' : Object.values(book.families).some((f) => f.kind === 'magic_e') ? '긴 모음' : '짝꿍 소리';   // 복습 줄에 쓰는 말 (3권 짝꿍 소리 · 4권 긴 모음)
  const range = (a, b) => (b < a ? '—' : a === b ? `p.${a}` : `pp.${a}–${b}`);
  // 진도표: 유닛 JSON 의 차시(lessons)마다 한 줄 — 쪽 범위도 그 차시의 실제 쪽 수로. withReview 면 일반 유닛 뒤에 복습 차시, 12유닛 뒤에 최종 평가
  function table(withReview) {
    let n = 0, rows = '';
    for (const u of book.units) {
      const uj = units[u.n], title = u.title, lt = B2 ? (u.families || []).map((f) => famLab(book, f)).join(' ') : (u.letters || []).map((l) => l.toUpperCase() + l).join(' ');
      const lessons = uj ? uj.lessons : [{ pages: Array(cnt(u, 'sb')).fill(0), workbook: Array(cnt(u, 'wb')).fill(0) }];
      let sp = sbStart(u.n), wp = wbStart(u.n);
      lessons.forEach((ls, li) => {
        const ns = (ls.pages || []).length, nw = (ls.workbook || []).length, sbR = range(sp, sp + ns - 1), wbR = range(wp, wp + nw - 1); sp += ns; wp += nw;
        let goal, snd = '', wd = '', cls = '';
        if (u.n === 0) { goal = `${B2 ? '모음 5개 소리' : '알파벳 이름·순서(알파벳 노래)'}, 친구들 소개${B2 ? `(새 친구 ${Object.values(book.characters).slice(-1).map((c) => c.ko || c.name).join('')})` : ''}, 도입 이야기 · 워크북 없음`; snd = B2 ? 'Preview: Vowels' : 'Preview: Alphabet'; }
        else if (u.show) { cls = 'rev'; goal = li === 0 ? (B2 ? '노래·징검다리·단어 사냥 (권 전체 복습)' : '알파벳 노래·A to Z 길·단어 사냥 (권 전체 복습)') : '되짚기 공연 + 복습 평가 + 수료증'; snd = li === 0 ? 'Show' : ''; }
        else if (u.review) { cls = 'rev'; goal = li === 0 ? `${u.review.join('·')}유닛 ${famWord} 복습 (놀이판·카드)` : `복습 이야기 + 빙고 + 복습 평가 (시험지 생성기 복습 ${u.n < 6 ? 1 : 2}, B형 있음)`; snd = li === 0 ? 'Review' : ''; }
        else if (li === 0) {
          snd = KIND ? (u.families || []).map((f) => '/' + ((book.families[f] || {}).sound || f) + '/').join(' ') : B2 ? `/${(book.vowels && book.vowels[u.vowel] || {}).sound || u.vowel}/` : u.letters.map((l) => '/' + book.letters[l].sound + '/').join(' ');
          const k0 = famKindOf(book, (u.families || [])[0]);
          goal = KIND ? `${k0 === 'magic_e' ? '마법 e' : k0 === 'blend' || k0 === 'final' ? '이어 소리' : k0 === 'team' ? '모음 짝' : '짝꿍 소리'} ${lt} 듣고 말하기·이어 읽기, 단어${uj ? ' ' + words(uj).split(', ').length + '개' : ''}` : B2 ? `단어 가족 ${lt} 이어 읽기(모음 ${u.vowel}), 단어${uj ? ' ' + words(uj).split(', ').length + '개' : ''}` : `글자 ${lt} 의 이름·소리, 대소문자 쓰기, 단어 ${uj ? words(uj).split(', ').length : 9}개`;
          wd = uj ? words(uj) : '';
        } else { goal = `${B2 ? '문장 읽기' : '듣고 말하기 복습'}, 사이트워드(${sw(u) || '—'}), 이야기, 유닛 정리`; wd = uj ? uj.story.title : ''; }
        n++; rows += `<tr class="${cls}"><td class="c">${n}</td><td class="c">${u.n}</td><td>${esc(title)}</td><td>${goal}</td><td>${snd}</td><td>${esc(wd)}</td><td class="c">${sbR}</td><td class="c">${wbR}</td></tr>`;
      });
      if (withReview && !u.review && u.n > 0) { n++; rows += `<tr class="rev"><td class="c">${n}</td><td class="c">${u.n}</td><td>${esc(title)}</td><td>유닛 복습: 플래시카드 경주, ${B2 ? '단어 잡기' : '소리 잡기'} 게임, 유닛 시험지 (A형 — B형은 시험지 생성기에서)</td><td></td><td></td><td class="c">—</td><td class="c">—</td></tr>`; }
    }
    // 최종 평가: 12유닛 뒤, 교재 밖 시험지
    n++; rows += `<tr class="fin"><td class="c">${n}</td><td class="c">—</td><td>최종 평가</td><td><b>최종 평가 (교재 밖 시험지)</b>: 종이 20문항(수준 1~3 중 하나, A/B형) + 말하기 체크리스트 — <a href="test.html?scope=all&level=2${bkq}">시험지 생성기</a> · PDF PopPhonics${BK}_FinalTest.pdf</td><td></td><td></td><td class="c">—</td><td class="c">—</td></tr>`;
    return { n, html: `<table><tr><th>차시</th><th>유닛</th><th>제목</th><th>목표·활동</th><th>${B2 && !KIND ? '모음' : '소리'}</th><th>단어 · 스토리</th><th>학생책</th><th>워크북</th></tr>${rows}</table>` };
  }
  const t2 = table(false), t3 = table(true);
  document.getElementById('topNote').textContent = `${t2.n}차시(주 2회 약 ${Math.ceil(t2.n / 2)}주) · ${t3.n}차시(주 3회 약 ${Math.ceil(t3.n / 3)}주, 유닛마다 복습 차시) — 둘 다 마지막은 최종 평가`;
  document.getElementById('out').innerHTML = `<div class="sheet"><h1>${esc(book.title)} 진도표 <small>${t2.n}차시 (0~12유닛 ${t2.n - 1} + 최종 평가 1) · 주 2회 약 ${Math.ceil(t2.n / 2)}주 · 50분</small></h1>${t2.html}</div>
    <div class="sheet"><h1>${esc(book.title)} 진도표 <small>${t3.n}차시 · 주 3회 약 ${Math.ceil(t3.n / 3)}주 · 유닛마다 복습 차시</small></h1>${t3.html}</div>`;
  window.PRINT_READY = true;
})();
</script>
</body>
</html>
